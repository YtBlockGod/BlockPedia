<title>BLOCKPEDIA — Minecraft Java 26.3</title>

<style>
:root{
 --bg:#101410;
 --panel:#192119;
 --panel2:#202b21;
 --green:#70d879;
 --green2:#3da94b;
 --text:#edf4ed;
 --muted:#a6b5a6;
 --border:#344536;
 --gold:#e8c66b;
 --red:#e47b72;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,Helvetica,sans-serif
}
header{
 background:#17251a;border-bottom:1px solid var(--border);
 padding:18px 5%;position:sticky;top:0;z-index:10
}
.top{
 display:flex;align-items:center;justify-content:space-between;
 gap:18px;flex-wrap:wrap
}
.logo{font-size:26px;font-weight:900;letter-spacing:1px;color:var(--green)}
.logo span{color:white}
.tagline{color:var(--muted);font-size:11px;margin-top:5px}
.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.search{
 width:min(420px,75vw);padding:12px 15px;border-radius:9px;
 border:1px solid var(--border);background:#0e160f;color:white;font-size:14px
}
.search:focus{outline:1px solid var(--green)}
.lang{
 padding:12px 16px;border-radius:9px;border:1px solid var(--green);
 background:#263a29;color:var(--green);font-weight:bold;cursor:pointer
}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 90px)}
aside{
 background:#141c15;border-right:1px solid var(--border);
 padding:20px;position:sticky;top:85px;height:calc(100vh - 85px);
 overflow:auto
}
aside h3{
 font-size:11px;color:var(--muted);text-transform:uppercase;
 letter-spacing:1.5px;margin:15px 0 10px
}
.navbtn{
 width:100%;text-align:left;background:transparent;color:#cbd8cb;
 border:0;padding:10px;border-radius:7px;cursor:pointer;
 font-size:13px;margin:2px 0
}
.navbtn:hover,.navbtn.active{background:#263a29;color:var(--green)}
main{padding:32px;max-width:1400px;width:100%;margin:auto}
.hero{
 background:linear-gradient(120deg,#203c25,#17251b);
 border:1px solid #38563b;border-radius:16px;padding:30px;margin-bottom:25px
}
.hero h1{font-size:36px;margin:0 0 12px}
.hero p{color:#c3d3c4;line-height:1.7;max-width:800px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.stat{
 background:#142018;border:1px solid var(--border);
 padding:12px 16px;border-radius:9px
}
.stat strong{display:block;color:var(--green);font-size:21px}
.stat small{color:var(--muted)}
.section-title{font-size:22px;margin:30px 0 15px}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
 gap:13px
}
.tile{
 background:var(--panel);border:1px solid var(--border);
 border-radius:11px;padding:17px;cursor:pointer;transition:.15s
}
.tile:hover{
 transform:translateY(-2px);border-color:var(--green);background:var(--panel2)
}
.tile .emoji{font-size:27px}
.tile h3{font-size:16px;margin:10px 0 7px}
.tile p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.pill{
 display:inline-block;color:var(--green);background:#213b26;
 padding:5px 9px;border-radius:20px;font-size:11px;margin-bottom:8px
}
.article{
 background:var(--panel);border:1px solid var(--border);
 border-radius:13px;padding:25px
}
.article h1{font-size:30px;margin:8px 0}
.article h2{font-size:19px;color:var(--green);margin-top:27px}
.article p,.article li{line-height:1.75;color:#d1ddd1}
.article ul{padding-left:22px}
.article .intro{color:var(--muted);font-size:16px}
.back{
 background:#263a29;color:var(--green);border:1px solid var(--border);
 padding:9px 13px;border-radius:7px;cursor:pointer;margin-bottom:18px
}
.note{
 background:#263222;border-left:3px solid var(--gold);
 padding:13px 16px;border-radius:5px;color:#e6dfc5;
 line-height:1.6;margin:15px 0
}
.warning{
 background:#382522;border-left:3px solid var(--red);
 padding:13px 16px;border-radius:5px;color:#f0c9c4;
 line-height:1.6;margin:15px 0
}
.code{
 background:#0c110d;border:1px solid var(--border);padding:12px;
 border-radius:7px;color:#9ce8a4;font-family:monospace;
 overflow-x:auto;margin:10px 0
}
.empty{padding:35px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px}
@media(max-width:760px){
 .layout{grid-template-columns:1fr}
 aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
 aside .navlist{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
 main{padding:16px}
 .hero h1{font-size:27px}
 header{position:static}
 .tools{width:100%}
 .search{width:100%;flex:1}
}

 });
}

 const cg=document.getElementById("categoryGrid");

 cg.innerHTML=categories.map(c=>`
  <div class="tile" onclick="showCategory('${c.id}')">
   <div class="emoji">${c.icon}</div>
   <h3>${categoryName(c)}</h3>
   <p>${language==="fr"?c.descFr:c.descEn}</p>
   <p style="margin-top:10px;color:var(--green)">
    ${articles.filter(a=>a[0]===c.id).length} ${t.files} →
   </p>
  </div>
 `).join("");

 const popularNames=[
  "Ferme à fer","Ferme à creepers","Raccommodage",
  "Chunks","Gamerules de Java 26.3","Spawn chunks : changement important",
  "Forêt tachetée","Élytres"
 ];

 const pg=document.getElementById("popularGrid");

 pg.innerHTML=popularNames.map(name=>{
  const a=articles.find(x=>x[1]===name);
  return a?tile(a):"";
 }).join("");
}

function tile(a){
 const cat=categories.find(c=>c.id===a[0]);
 const title=language==="fr"?a[1]:a[2];
 const summary=language==="fr"?a[3]:a[4];

 return `
 <div class="tile" onclick="showArticle('${escapeText(a[1])}')">
  <span class="pill">${cat?categoryName(cat):"Guide"}</span>
  <h3>${title}</h3>
  <p>${summary}</p>
  <p style="color:var(--green);margin-top:12px">
   ${interfaceText[language].read}
  </p>
 </div>`;
}

function showHome(btn){
 makeHome();
 setActive(btn);
 window.scrollTo(0,0);
}

function setActive(btn){
 document.querySelectorAll(".navbtn").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");
}

function showCategory(id,btn){
 const t=interfaceText[language];
 const cat=categories.find(c=>c.id===id);
 const list=articles.filter(a=>a[0]===id);

 document.getElementById("content").innerHTML=`
 <button class="back" onclick="showHome()">${t.back}</button>

 <section class="hero">
  <span class="pill">${t.category}</span>
  <h1>${cat.icon} ${categoryName(cat)}</h1>
  <p>${language==="fr"?cat.descFr:cat.descEn}</p>
  <div class="stats">
   <div class="stat">
    <strong>${list.length}</strong>
    <small>${t.available}</small>
   </div>
  </div>
 </section>

 <div class="grid">
  ${list.map(tile).join("")}
 </div>`;

 setActive(btn);
 window.scrollTo(0,0);
}

function showArticle(name){
 const a=articles.find(x=>x[1]===name);
 if(!a)return;

 const t=interfaceText[language];
 const cat=categories.find(c=>c.id===a[0]);

 const title=language==="fr"?a[1]:a[2];
 const summary=language==="fr"?a[3]:a[4];

 const sections=[
  {title:t.how,content:language==="fr"?a[5]:a[6]},
  {title:t.important,content:language==="fr"?a[7]:a[8]},
  {title:t.remember,content:language==="fr"?a[9]:a[10]},
  {title:t.tips,content:language==="fr"?a[11]:a[12]}
 ];

 let sectionHTML=sections.map(s=>`
  <h2>${s.title}</h2>
  <p>${s.content}</p>
 `).join("");

 document.getElementById("content").innerHTML=`
 <button class="back" onclick="showCategory('${a[0]}')">
  ← ${categoryName(cat)}
 </button>

 <article class="article">
  <span class="pill">${cat.icon} ${categoryName(cat)}</span>
  <h1>${title}</h1>
  <p class="intro">${summary}</p>

  ${sectionHTML}

  <div class="note">
   <strong>${t.know}</strong>
   ${t.disclaimer}
  </div>
 </article>`;

 window.scrollTo(0,0);
}

/* =========================================================
   RECHERCHE
========================================================= */

function searchContent(){
 const q=document.getElementById("search").value.toLowerCase().trim();

 if(!q){
  showHome();
  return;
 }

 const results=articles.filter(a=>{
  return a.join(" ").toLowerCase().includes(q);
 });

 const t=interfaceText[language];

 document.getElementById("content").innerHTML=`
 <button class="back" onclick="showHome()">${t.back}</button>

 <h1>${t.results}</h1>

 <p style="color:var(--muted)">
  ${results.length} ${t.resultFor} « ${escapeHTML(q)} »
 </p>

 ${
  results.length
  ? `<div class="grid">${results.map(tile).join("")}</div>`
  : `<div class="empty">${t.noResults}</div>`
 }`;

 setActive(null);
}

function escapeText(s){
 return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

/* =========================================================
   INITIALISATION
========================================================= */

document.getElementById("search").placeholder=interfaceText.fr.search;
makeNav();
makeHome();

</script>
</body>
</html>
